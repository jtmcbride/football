[project]
name = "football-analysis"
version = "0.1.0"
description = "Local-first NFL tracking data analysis and visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
football = "ftbdata.cli:main"

[tool.uv]
package = true

[tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["packages/ftbdata/tests"]
pythonpath = ["packages/ftbdata/src"]

[tool.hatch.build.targets.wheel]
packages = ["packages/ftbdata/src/ftbdata"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
